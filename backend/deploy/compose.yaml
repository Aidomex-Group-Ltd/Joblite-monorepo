# Isolated Docker release verification stack for Joblite.
#
# Runs the assembled `joblite` release against a private PostgreSQL with TLS,
# behind a local HTTPS proxy, without touching any existing Joblite database,
# container, volume or port (development compose.yaml uses 127.0.0.1:5543;
# older Joblite v2 deployment containers are never referenced).
#
# Migrations are NEVER run automatically: use the explicit one-off command in
# README.md. Requires JOBLITE_BUILD_ID (the id printed by build-images.sh):
#   export JOBLITE_BUILD_ID=<id>
#   docker compose up -d db
#   docker compose --profile ops run --rm migrate eval 'JobliteWeb.Release.migrate()'
#   docker compose up -d
#   docker compose down            # keep volumes; down -v deletes them

name: joblite-release-verify

services:
  # One-shot local certificate generator (local verification only).
  certs:
    image: postgres:18
    entrypoint: ["/bin/sh", "/scripts/certs.sh"]
    volumes:
      - certs:/certs
      - ./certs.sh:/scripts/certs.sh:ro

  # Private PostgreSQL with TLS; no host port is published.
  # The weak flags below (fsync=off) are local-verification-only: this
  # instance never holds real candidate data.
  db:
    image: postgres:18
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - fsync=off
    environment:
      POSTGRES_USER: joblite
      POSTGRES_PASSWORD: joblite_release_verify_only
      POSTGRES_DB: joblite_release_verify
    volumes:
      - db_data:/var/lib/postgresql
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblite -d joblite_release_verify"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [joblite-net]

  # One-off migration/maintenance container (backend image, same release).
  # Explicit only: never started by `docker compose up`.
  migrate:
    image: "joblite-backend:${JOBLITE_BUILD_ID:?set JOBLITE_BUILD_ID to the id printed by deploy/build-images.sh}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://joblite:joblite_release_verify_only@db:5432/joblite_release_verify"
      DATABASE_CA_CERT: /certs/ca.crt
      DATABASE_SSL_SERVER_NAME: joblite-db
      POOL_SIZE: "5"
    volumes:
      - certs:/certs:ro
    networks: [joblite-net]
    profiles: [ops]

  # Product image: Phoenix endpoint + LiveView over the isolated database.
  # SECRET_KEY_BASE comes from the gitignored .env file, never from the repo.
  app:
    image: "joblite-liveview:${JOBLITE_BUILD_ID:?set JOBLITE_BUILD_ID to the id printed by deploy/build-images.sh}"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "ecto://joblite:joblite_release_verify_only@db:5432/joblite_release_verify"
      DATABASE_CA_CERT: /certs/ca.crt
      DATABASE_SSL_SERVER_NAME: joblite-db
      POOL_SIZE: "5"
      PHX_HOST: localhost
      PORT: "4000"
    volumes:
      - certs:/certs:ro
    healthcheck:
      # Readiness (not just liveness) gates the app on real database access.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [joblite-net]

  # Local HTTPS termination so the browser origin is exactly https://localhost
  # (matches the release's check_origin, secure cookies and force_ssl).
  proxy:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    networks: [joblite-net]

networks:
  joblite-net:
    driver: bridge

volumes:
  db_data:
  certs:
