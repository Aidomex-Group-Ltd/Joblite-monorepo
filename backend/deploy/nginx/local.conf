# Local TLS front for the isolated release verification stack.
#
# Terminates HTTPS on 127.0.0.1:443 so the browser origin stays
# https://localhost, which matches the release's production settings:
# check_origin ["https://localhost"], url scheme https/port 443,
# secure session cookies, and force_ssl with x_forwarded_proto.
# Origin checks stay enabled; nothing is weakened for local use.

server {
  listen 443 ssl;
  server_name localhost;

  ssl_certificate     /certs/localhost.crt;
  ssl_certificate_key /certs/localhost.key;

  client_max_body_size 20m;

  location / {
    proxy_pass http://app:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 65s;
  }
}
